<body><div class="shell"><aside class="sidebar"><div class="brand">地區友好總會</div><div class="subbrand">台中南區 · 2027 年度</div><nav class="nav" aria-label="主要功能"><button data-page="overview">總會總覽</button><button data-page="district">地區工作區</button></nav><div class="side-note"><b>異體同心 · 勇躍前進</b><p>晴爽、歡喜、無事故<br>全員出席、大勝利<br>異體同心、人才輩出</p></div></aside><main class="main"><header class="topbar"><small>邁向創立一百週年 勇躍前進之年</small><span class="local">目前瀏覽器儲存 · 尚未共用</span></header><div class="content" id="content"></div></main></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div><script>'use strict';
let cloudTestMode=false,cloudEndpoint='',cloudConnected=false,cloudBusy=false,cloudError='',cloudBridge=null,cloudNonce='',cloudMetadata={districts:{}},cloudReady=null,cloudSyncAt='',cloudPollTimer=null;const cloudPending=new Map();let cloudOperation=null;
function cloudEnabled(){return Boolean(cloudEndpoint)}
function cloudPanel(){if(!cloudEnabled())return '';return `<section class="cloud-panel ${cloudConnected?'connected':''}" aria-label="雲端上傳服務"><div><b>${cloudBusy?'正在上傳 Google 雲端…':cloudConnected?(cloudTestMode?'測試環境 · 已就緒':'自動上傳已就緒'):'正在連接雲端…'}</b><p>${cloudConnected?'確認送出後，自動產生 Word 並存入對應資料夾。':esc(cloudError||'正在準備上傳服務，無需輸入代碼。')}</p></div>${cloudError?'<button class="btn" id="cloud-refresh">重新連接</button>':''}</section>`}
function cloudCopy(html){if(!cloudConnected)return html;const pairs=[['可操作版本：資料只存於目前瀏覽器，尚未同步給其他人。請定期匯出備份。','已連接共用資料。送出後會自動產生 Word 並上傳指定的每週資料夾。'],['目前僅顯示此瀏覽器的紀錄','目前顯示總會共用雲端紀錄'],['尚未串接多人共用資料與雲端歸檔。這裡沒有紀錄，不代表其他幹部未回報；共用串接後才可用來催報。','資料來自共用雲端；切換週次查看各地區回報狀態。只有 Google 確認檔案建立成功的紀錄會顯示已歸檔。'],['目前儲存在此瀏覽器，尚未回傳每週雲端資料夾。','送出時自動產生 Word，並上傳本次運營資料夾。'],['資料夾會依運營週次切換。目前仍需自行上傳，儲存不代表雲端已收到。','資料夾會依運營週次切換。送出後請等待成功訊息；若失敗可保留內容重試。'],['儲存前會先顯示全部內容供確認；目前不會自動上傳雲端。','確認送出後，系統會產生 Word 並上傳；成功後顯示歸檔狀態。'],['確認送出後儲存在此瀏覽器，尚未與其他人共用。','確認後送至共用雲端。運營紀錄會自動產生 Word 並上傳。'],['此處用於紀錄狀態，尚未自動傳送資料至區。','確認後將更新共用雲端資料。'],['儲存運營紀錄','確認並送出運營紀錄'],['尚未串接','尚未歸檔'],['已連結「幸福1+1＆體驗稿件回傳區」。請開啟雲端資料夾手動上傳；下方保存功能只存於此瀏覽器，不會自動上傳。','上傳後會自動存入「幸福1+1＆體驗稿件回傳區」，並與各地區幹部共用。'],['保存稿件到此瀏覽器','上傳稿件至雲端'],['保存PPT到此瀏覽器','上傳PPT至雲端'],['檔案本體不包含在 JSON 紀錄備份中，請從各檔案列表個別下載備份。','雲端檔案本體不包含在 JSON 備份內，請從檔案連結下載。']];pairs.forEach(([a,b])=>html=html.split(a).join(b));return html}
function cloudDomain(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com'))}catch{return false}}
window.addEventListener('message',e=>{const m=e.data;if(!cloudDomain(e.origin)||!m||m.channel!=='assembly-cloud'||m.nonce!==cloudNonce)return;if(m.ready){cloudBridge=e.source;if(cloudReady){cloudReady.resolve();cloudReady=null}return}const pending=cloudPending.get(m.id);if(!pending||e.source!==cloudBridge)return;clearTimeout(pending.timer);cloudPending.delete(m.id);m.ok?pending.resolve(m.data):pending.reject(Error(m.error||'雲端作業失敗'))});
function ensureCloudBridge(){if(cloudBridge)return Promise.resolve();if(cloudReady)return cloudReady.promise;cloudNonce=crypto.randomUUID();let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});cloudReady={promise,resolve,reject};const iframe=document.createElement('iframe');iframe.hidden=true;iframe.id='assembly-cloud-bridge';const url=new URL(cloudEndpoint);url.searchParams.set('client',location.origin);url.searchParams.set('nonce',cloudNonce);iframe.src=url.href;document.getElementById('assembly-cloud-bridge')?.remove();document.body.append(iframe);setTimeout(()=>{if(cloudReady){cloudReady.reject(Error('Google 雲端連線逾時，請重新連接。'));cloudReady=null;iframe.remove()}},30000);return promise}
async function cloudRequest(action,payload={}){await ensureCloudBridge();return new Promise((resolve,reject)=>{const id=crypto.randomUUID(),timer=setTimeout(()=>{cloudPending.delete(id);reject(Error('送出逾時，尚未確認是否完成。請使用原內容重試，系統會防止重複建立。'))},120000);cloudPending.set(id,{resolve,reject,timer});cloudBridge.postMessage({channel:'assembly-cloud',nonce:cloudNonce,id,request:JSON.parse(JSON.stringify({action,payload,public:true,test:cloudTestMode}))},'*')})}
function cloudApply(db){validate(db);state=db;cloudSyncAt=new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});try{sessionStorage.setItem(KEY+'-cloud-cache',JSON.stringify(db))}catch{}}
async function cloudLoad(silent=false){if(cloudBusy||dirty&&silent)return;if(dirty&&!discard())return;try{const result=await cloudRequest('load');if(result.state)cloudApply(result.state);if(result.metadata)cloudMetadata=result.metadata;cloudConnected=true;cloudError='';dirty=false;render()}catch(e){cloudError=e.message;if(!silent){cloudConnected=false;render()}else toast('共用資料暫時無法更新：'+e.message)}}
function cloudBusyUi(value){cloudBusy=value;document.querySelectorAll('#content button[type="submit"]').forEach(b=>b.disabled=value);const b=document.getElementById('cloud-refresh');if(b)b.disabled=value;const status=document.querySelector('.cloud-panel b');if(status)status.textContent=value?'正在上傳 Google 雲端…':cloudConnected?(cloudTestMode?'測試環境 · 已就緒':'自動上傳已就緒'):'正在連接雲端…';window.onbeforeunload=value?()=>true:null}
async function blobBase64(blob){const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
function cloudSuccess(message,url){render();toast(message);if(url){const n=document.createElement('div');n.className='cloud-receipt';n.setAttribute('role','status');n.textContent='Word 已成功上傳至本次運營資料夾，填寫完成。';document.querySelector('.weekly-meeting')?.prepend(n)}}
async function cloudSaveMeeting(m){if(!cloudConnected){cloudError='請先連接共用雲端再送出';render();return}if(cloudBusy)return;cloudBusyUi(true);try{const normalized={...m};delete normalized.id;delete normalized.updatedAt;delete normalized.cloud;const fingerprint=JSON.stringify(normalized);if(!cloudOperation||cloudOperation.fingerprint!==fingerprint)cloudOperation={fingerprint,id:crypto.randomUUID()};const old=data(m.district).meetings.find(v=>v.kind==='weekly-v1'&&Number(v.round)===Number(m.round));const result=await cloudRequest('submit',{record:m,requestId:cloudOperation.id,baseRevision:cloudMetadata.districts[m.district]?.meetings?.[m.round]??m.cloud?.revision??old?.cloud?.revision??0});const d=data(m.district),list=d.meetings.filter(v=>!(v.kind==='weekly-v1'&&Number(v.round)===Number(m.round)));list.push(result.record);state.districts[m.district]={...d,meetings:list,updatedAt:result.record.updatedAt};state.revision=result.revision;const meta=cloudMetadata.districts[m.district]||{meetings:{}};meta.meetings[m.round]=result.record.cloud.revision;meta.updatedAt=result.record.updatedAt;cloudMetadata.districts[m.district]=meta;cloudKeepLocal();editId=result.record.id;dirty=false;cloudOperation=null;cloudSuccess('Word 已成功上傳',result.record.cloud.url)}catch(e){toast('上傳未完成：'+e.message);cloudError=e.message}finally{cloudBusyUi(false)}}
async function cloudPatch(change){if(!cloudConnected){toast('請先連接共用雲端再送出');return}if(cloudBusy)return;cloudBusyUi(true);try{const name=selected,result=await cloudRequest('patch',{district:name,change,baseUpdatedAt:cloudMetadata.districts[name]?.updatedAt||''});state.districts[name]={...data(name),...result.change,updatedAt:result.updatedAt};cloudMetadata.districts[name]={...(cloudMetadata.districts[name]||{meetings:{}}),updatedAt:result.updatedAt};state.revision=result.revision;cloudKeepLocal();dirty=false;cloudSuccess('已更新共用資料')}catch(e){toast('儲存失敗：'+e.message)}finally{cloudBusyUi(false)}}
async function cloudConfirm(name,id,by){if(!cloudConnected||cloudBusy)return;cloudBusyUi(true);try{const m=data(name).meetings.find(v=>v.id===id);const result=await cloudRequest('confirm',{district:name,id,by,baseRevision:m.cloud.revision});state.districts[name]=result.district;state.revision=result.revision;dirty=false;cloudSuccess('已更新內容確認狀態')}catch(e){toast('確認失敗：'+e.message)}finally{cloudBusyUi(false)}}
function cloudAttachmentHtml(d,type){return (d.attachments||[]).filter(v=>v.type===type).map(v=>`<article class="uploaded-file"><strong>${esc(v.name)}</strong><small>${esc(new Date(v.uploadedAt).toLocaleString('zh-TW'))}</small><p>${esc(v.description||'')}</p><span class="tag">已上傳至共用雲端</span></article>`).join('')||'<div class="empty">尚無雲端檔案。</div>'}
function bindCloud(){const label=document.querySelector('.topbar .local');if(label)label.textContent=cloudConnected?'Google 雲端自動上傳':'正在連接雲端';const refresh=$('#cloud-refresh');if(refresh)refresh.onclick=()=>cloudLoad();if(!cloudConnected){if(cloudEnabled())document.querySelectorAll('#content form:not(#cloud-connect-form) input,#content form:not(#cloud-connect-form) textarea,#content form:not(#cloud-connect-form) select,#content form:not(#cloud-connect-form) button').forEach(el=>el.disabled=true);return}document.querySelectorAll('[data-upload]').forEach(f=>{f.onsubmit=async e=>{e.preventDefault();if(cloudBusy)return;const file=f.elements.file.files[0];if(!file||!file.size)return;if(file.size>25*1024*1024){toast('檔案超過25 MB');return}const name=selected,key=[name,f.dataset.upload,file.name,file.size,file.lastModified].join('|');if(!f.cloudOperation||f.cloudOperation.key!==key)f.cloudOperation={key,id:crypto.randomUUID()};cloudBusyUi(true);try{const result=await cloudRequest('attachment',{district:name,type:f.dataset.upload,name:file.name,mime:file.type,description:f.elements.description.value,content:await blobBase64(file),requestId:f.cloudOperation.id});const d=data(name);state.districts[name]={...d,attachments:[...(d.attachments||[]).filter(a=>a.id!==result.attachment.id),result.attachment],updatedAt:result.updatedAt};cloudMetadata.districts[name]={...(cloudMetadata.districts[name]||{meetings:{}}),updatedAt:result.updatedAt};cloudKeepLocal();dirty=false;cloudSuccess('檔案已成功上傳至共用雲端')}catch(err){toast('上傳失敗：'+err.message)}finally{cloudBusyUi(false)}}});for(const type of ['manuscript','ppt']){const el=$('#files-'+type);if(el)el.innerHTML=cloudAttachmentHtml(data(),type)}}
async function initializeCloud(){try{const res=await fetch('cloud-config.json',{cache:'no-store'});if(!res.ok)return;const cfg=await res.json();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(cfg.endpoint||''))return;cloudEndpoint=cfg.endpoint;cloudTestMode=cfg.testMode===true;try{localStorage.removeItem(KEY+'-cloud-code');sessionStorage.removeItem(KEY+'-cloud-code')}catch{}render();await cloudLoad();cloudPollTimer=setInterval(()=>{if(cloudConnected&&!cloudBusy&&!dirty&&!document.hidden)cloudLoad(true)},60000)}catch(e){cloudError=e.message}}

function cloudBackup(){return `<h1>備份與匯出</h1><section class="panel"><h2>下載共用資料備份</h2><p>下載目前已讀取的各地區運營紀錄、人員、人數與籌備狀態。Word 與稿件本體由系統保存於雲端，不包含在此備份內。</p><div class="actions"><button class="btn primary" id="export-json">匯出完整備份</button><button class="btn" id="export-csv">匯出人數統計 CSV</button></div></section><section class="panel"><h2>儲存與同步</h2><p>送出運營紀錄後，系統會自動產生 Word 並歸檔。看到成功訊息才代表 Google 已收到。</p><p>共用資料會每分鐘重新讀取；有尚未送出的輸入時暫停更新，以保留正在填寫的內容。</p><p>個人釘選仍保存在各自的裝置，填寫與上傳不需代碼。</p></section>`}

function validate(s){if(!s||s.version!==1||!s.districts||typeof s.districts!=='object'||Array.isArray(s.districts))throw Error('格式不符');const valid=new Set(SCHEDULE.map(x=>x.name));for(const [name,d] of Object.entries(s.districts)){if(!valid.has(name)||!d||typeof d!=='object'||!Array.isArray(d.meetings)||!d.staff||!d.counts||!d.tasks)throw Error('地區格式不符');if(d.uploadSettings){if(typeof d.uploadSettings!=='object'||Array.isArray(d.uploadSettings))throw Error('雲端設定格式不符');for(const v of Object.values(d.uploadSettings))if(typeof v!=='string'||v&&!driveFolder(v))throw Error('雲端連結不符')}if(d.meetings.length>1000)throw Error('紀錄過多');for(const m of d.meetings){if(!m||typeof m.id!=='string'||typeof m.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(m.date)||typeof m.decisions!=='string')throw Error('會議格式不符');if(m.kind==='weekly-v1')validateWeeklyRecord(m);if(m.reporting&&(!m.reporting.confirmedBy||typeof m.reporting.confirmedBy!=='string'||m.reporting.confirmedBy.length>500||typeof m.reporting.confirmedAt!=='string'||!Number.isFinite(Date.parse(m.reporting.confirmedAt))))throw Error('確認紀錄格式不符');if(m.reports&& (typeof m.reports!=='object'||Array.isArray(m.reports)))throw Error('報告格式不符')}for(const v of Object.values(d.staff))if(typeof v!=='string'||v.length>10000)throw Error('分工格式不符');for(const [g,row] of Object.entries(d.counts)){if(!groups.includes(g)||!row||typeof row!=='object')throw Error('人數格式不符');for(const v of Object.values(row))if(v!==''&&(!Number.isInteger(Number(v))||Number(v)<0||Number(v)>100000))throw Error('人數不符')}for(const [k,v] of Object.entries(d.tasks))if(!/^\d+$/.test(k)||+k>=tasks.length||!['尚未開始','進行中','已完成','不適用'].includes(v))throw Error('進度不符')}}

function reportIssues(m){if(!m)return [];const issues=[];const missing=v=>!String(v??'').trim();const uncertain=v=>/待確認|未確認|待定|未定|待安排/.test(String(v??''));for(const [key,label] of [['recorder','紀錄人'],['meetingTime','開會時間'],['location','會議地點'],['attendees','出席人員'],['decisions','本次討論與決議']]){if(missing(m[key]))issues.push(label+'未填寫');else if(uncertain(m[key]))issues.push(label+'待確認')}const w=m.weekly||{};let gaps=0;for(let r=0;r<3;r++)for(let c=0;c<5;c++)if(w.targets?.[r]?.[c]===''||w.targets?.[r]?.[c]===undefined)gaps++;if(gaps)issues.push('各部人數目標尚有 '+gaps+' 格未填寫');const work=(w.work||[]).filter(v=>missing(v.person)||uncertain(v.person)||uncertain(v.notes)).length;const program=(w.program||[]).filter(v=>missing(v.person)||uncertain(v.person)||uncertain(v.notes)).length;if(work)issues.push('工作分工尚有 '+work+' 項待確認');if(program)issues.push('程序擔當尚有 '+program+' 項待確認');if(missing(w.districtGoal)||uncertain(w.districtGoal))issues.push('地區祈念目標待確認');if(!w.sandDate)issues.push('沙推運營日期待確認');if(m.pending?.trim()&&!/^(無|無待確認事項|無待辦|不適用)[。\s]*$/.test(m.pending.trim()))issues.push('另有登錄待確認事項');return issues}

function reportingPage(){const rows=reportRows(),counts=Object.fromEntries(['missing','pending','confirmed','archived','na'].map(k=>[k,rows.filter(r=>r.key===k).length]));const visible=rows.filter(r=>(reportFilter==='all'||reportFilter==='attention'&&['missing','pending'].includes(r.key)||r.key===reportFilter)&&r.schedule.name.includes(reportQuery));const order={missing:0,pending:1,confirmed:2,archived:3,na:4};visible.sort((a,b)=>order[a.key]-order[b.key]);const session=WEEKLY_SESSIONS[reportRound-1];return `<div class="report-heading"><div><h1>運營回報總覽</h1><p class="muted">先看哪些地區還沒填，再追蹤哪些內容還待確認。</p></div><button class="btn" id="report-demo">${reportDemo?'返回本機資料':'查看示範狀態'}</button></div><div class="report-source ${reportDemo?'is-demo':''}" role="note"><strong>${reportDemo?'示範預覽，不會存入正式紀錄':'目前僅顯示此瀏覽器的紀錄'}</strong><p>${reportDemo?'以下狀態用來預覽完成後的管理畫面。返回本機資料即可查看實際紀錄。':'尚未串接多人共用資料與雲端歸檔。這裡沒有紀錄，不代表其他幹部未回報；共用串接後才可用來催報。'}</p></div><div class="report-controls"><label class="field"><span>運營週次</span><select id="report-round">${WEEKLY_SESSIONS.map(([date,n],i)=>`<option value="${i+1}" ${reportRound===i+1?'selected':''}>${dateLabel(date)} 第${n}次運營</option>`).join('')}</select></label><label class="field"><span>搜尋地區</span><input id="report-search" type="search" placeholder="輸入地區名稱" value="${esc(reportQuery)}"></label></div><div class="report-status-filters" aria-label="回報狀態篩選">${[['attention','需要追蹤',counts.missing+counts.pending],['missing','未填寫',counts.missing],['pending','待確認',counts.pending],['confirmed','已確認',counts.confirmed],...((reportDemo||cloudConnected)?[['archived','已歸檔',counts.archived]]:[]),['all','全部地區',rows.length]].map(([key,label,n])=>`<button class="report-filter ${key===reportFilter?'active':''}" data-report-filter="${key}" aria-pressed="${key===reportFilter}">${label}<b>${n}</b></button>`).join('')}</div><div class="report-results-heading"><h2>${reportFilter==='attention'?'需要追蹤的地區':{missing:'尚未填寫',pending:'資料待確認',confirmed:'已確認的地區',archived:'已歸檔的地區',all:'全部地區'}[reportFilter]}</h2><span class="muted" aria-live="polite">${visible.length} 個地區</span></div><p class="saved-note">${dateLabel(session[0])} 運營 · 回傳提醒：會後兩日內（${dateLabel(datePlus(session[0],2))}） · 本週不需回報 ${counts.na} 個地區。</p><div class="report-table" role="region" aria-label="各地區回報狀態"><div class="report-table-head"><span>地區</span><span>資料填寫</span><span>內容確認</span><span>雲端歸檔</span><span>查看</span></div>${visible.length?visible.map(r=>reportRow(r)).join(''):'<div class="empty">沒有符合篩選的地區。</div>'}</div><details class="report-rules"><summary>狀態如何判斷</summary><p>未填寫：沒有這一週的網站運營紀錄。待確認：資料有缺漏、文字標示待確認，或尚未由幹部確認。已確認：檢查項目填齊且完成確認。雲端歸檔須以實際上傳成功結果為準。</p><p>檢查範圍：紀錄人、開會時間與地點、出席人員、決議、15 格人數、18 項分工、6 項程序、地區祈念目標、沙推日期及待確認事項。確實無需安排的人員可填「不適用」。</p><p>本週已舉辦完總會的地區顯示不需回報；修改運營紀錄後必須重新確認。</p></details>`}
function reportRow(r){const s=r.schedule,m=r.record,entered=!['missing','na'].includes(r.key),confirmed=['confirmed','archived'].includes(r.key);return `<details class="report-row ${r.key}"><summary><span class="report-district"><b>${s.name}地區</b><small>${esc(r.detail)}</small></span><span data-label="資料填寫"><span class="report-badge ${r.key==='na'?'neutral':entered?'complete':'missing'}">${r.key==='na'?'不需回報':entered?'已填寫':'未填寫'}</span></span><span data-label="內容確認"><span class="report-badge ${confirmed?'complete':entered?'pending':'neutral'}">${r.key==='na'?'—':confirmed?'已確認':entered?'待確認':'尚未填寫'}</span></span><span data-label="雲端歸檔"><span class="report-badge ${r.key==='archived'||m?.cloud?.fileId?'complete':'neutral'}">${r.key==='na'?'—':m?.cloud?.fileId?'已歸檔':r.demo?r.key==='archived'?'已歸檔':'尚未上傳':'尚未串接'}</span></span><span class="report-expand">展開</span></summary><div class="report-row-body">${r.demo?'<p>示範資料僅供查看狀態，不能儲存或確認。</p>':r.key==='na'?'<p>正式總會已結束，本週不再安排運營回報。</p>':m?`<p><b>紀錄人：</b>${esc(m.recorder||'未填寫')}　<b>更新：</b>${esc(new Date(m.updatedAt).toLocaleString('zh-TW'))}</p>${r.issues.length?`<h3>需要補齊或確認</h3><ul>${r.issues.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p>自動檢查項目已填齊，請由幹部核對實際內容。</p>'}<details class="report-content"><summary>查看本次紀錄內容</summary>${reportRecordContent(m)}</details>${confirmed?`<p class="report-confirmed-by">已由 ${esc(m.reporting.confirmedBy)} 於 ${esc(new Date(m.reporting.confirmedAt).toLocaleString('zh-TW'))} 確認。${m.cloud?.fileId?'Word 已歸檔。':'雲端尚未串接。'}</p>`:!r.issues.length?`<form class="report-confirm-form" data-review-title="運營內容確認" data-report-district="${s.name}" data-report-id="${esc(m.id)}">${field('確認人姓名','confirmedBy','','text',false,true)}<p class="saved-note">請先核對上方紀錄，再確認內容。</p><button class="btn primary" type="submit">確認這份運營資料</button></form>`:''}${true?`<button class="btn" data-report-edit="${s.name}" data-report-id="${esc(m.id)}">修改這份紀錄</button>`:''}`:`<p>目前此瀏覽器沒有${s.name}地區第${WEEKLY_SESSIONS[reportRound-1][1]}次運營紀錄。</p>${true?`<button class="btn primary" data-report-new="${s.name}">填寫本週運營紀錄</button>`:'<p class="saved-note">其他地區目前尚未套用新的運營表格，先保留總覽位置。</p>'}`}</div></details>`}
function reportRecordContent(m){const w=m.weekly;return `<dl class="report-record-content">${[['開會日期',m.date],['開會時間',m.meetingTime],['會議地點',m.location],['紀錄人',m.recorder],['紀錄人部別',m.department],['出席人員',m.attendees],['導讀人員',m.reading],['沙推日期',w.sandDate],['地區祈念目標',w.districtGoal],['個人目標',w.personalGoal],['上次決議追蹤',m.previous],['本次決議',m.decisions],['待確認事項',m.pending],['下次運營事項',w.nextAgenda],['下次開會日期',m.nextDate]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'未填寫')}</dd></div>`).join('')}${w.targets.map((row,i)=>`<div><dt>${WEEKLY_TARGET_ROWS[i]}</dt><dd>${row.map((v,c)=>WEEKLY_GROUPS[c]+'：'+(v===''?'未填寫':esc(v))).join('；')}</dd></div>`).join('')}${[...w.work,...w.program].map(v=>`<div><dt>${esc((v.department||'程序')+' · '+v.role)}</dt><dd>${esc(v.person||'未填寫')}${v.notes?'｜'+esc(v.notes):''}</dd></div>`).join('')}</dl>`}
function confirmReport(name,id,by){if(cloudEnabled()){cloudConfirm(name,id,by);return false}if(!by.trim())throw Error('請填寫確認人姓名');const next=structuredClone(state),d=next.districts[name],m=d?.meetings.find(v=>v.id===id);if(!m||reportIssues(m).length)throw Error('資料仍有待確認項目，請先補齊');m.reporting={confirmedAt:new Date().toISOString(),confirmedBy:by.trim()};d.updatedAt=new Date().toISOString();return persist(next)}
function bindReporting(){if(page!=='reporting')return;$('#report-round').onchange=e=>{if(!discard()){e.target.value=String(reportRound);return}reportRound=Number(e.target.value);render()};$('#report-search').oninput=e=>{if(e.isComposing)return;if(!discard()){e.target.value=reportQuery;return}reportQuery=e.target.value;const start=e.target.selectionStart;render();const input=$('#report-search');input.focus();if(start!==null)input.setSelectionRange(start,start)};$('#report-search').oncompositionend=e=>$('#report-search').oninput({target:e.target,isComposing:false});$('#report-demo').onclick=()=>{if(!discard())return;reportDemo=!reportDemo;if(reportFilter==='archived')reportFilter='all';render()};document.querySelectorAll('[data-report-filter]').forEach(b=>b.onclick=()=>{if(!discard())return;reportFilter=b.dataset.reportFilter;render()});document.querySelectorAll('[data-report-new],[data-report-edit]').forEach(b=>b.onclick=()=>{const name=b.dataset.reportNew||b.dataset.reportEdit;if(!discard())return;page='district';selected=name;tab='meeting';editId=b.dataset.reportId||null;render();if(!editId){const f=$('#meeting-form[data-weekly]');if(f){f.elements.round.value=String(reportRound);f.elements.round.onchange();dirty=false}}window.scrollTo({top:0})});document.querySelectorAll('.report-confirm-form').forEach(f=>f.onsubmit=e=>{e.preventDefault();try{if(confirmReport(f.dataset.reportDistrict,f.dataset.reportId,f.elements.confirmedBy.value))render()}catch(err){toast(err.message)}})}
function overview(){const all=SCHEDULE;let records=0,done=0,totalInvited=0;all.forEach(s=>{const d=overviewCurrentData(data(s.name));records+=d.meetings.length;done+=completion(d).pct===100?1:0;totalInvited+=groups.reduce((a,g)=>a+Number(d.counts[g]?.invited||0),0)});return `<div class="head"><div><div class="eyebrow">2027 年度 · 台中南區</div><h1>地區友好總會</h1><p class="muted">邁向創立一百週年 勇躍前進之年</p></div></div><div class="head"><div><h2>各地區時間進度</h2><p class="muted">活動日期：2026/12/03–12/27 · 金色節點為彩排，藍色終點為正式總會</p></div></div><div class="toolbar"><label class="sr-only" for="search">搜尋地區</label><input id="search" placeholder="搜尋地區名稱…" value="${esc(query)}"><label class="sr-only" for="filter">場次篩選</label><select id="filter"><option value="all">所有場次</option><option value="upcoming">總會時間未到</option><option value="rehearsed">彩排時間已到</option><option value="ended">總會時間已到</option></select><span id="result-count" class="muted"></span></div><div id="cards"></div><div class="stats"><div class="stat"><small>總會地區</small><strong>22<em>個地區</em></strong></div><div class="stat"><small>網站運營紀錄</small><strong>${records}<em>份</em></strong></div><div class="stat"><small>目前邀約人數</small><strong>${totalInvited}<em>人</em></strong></div><div class="stat"><small>籌備事項全數完成</small><strong>${done}<em>個地區</em></strong></div></div><details class="panel staff-search-panel"><summary class="staff-search-toggle"><span id="staff-search-title">幹部姓名查詢</span><span class="collapse-hint">展開／收合</span></summary><div class="staff-search-body"><p class="muted">輸入姓名，立即查詢已登錄的地區與使命。可輸入部分姓名，同一人有多項分工會一併顯示。</p><label class="field"><span class="sr-only">幹部姓名</span><input id="staff-search" type="search" placeholder="輸入幹部姓名，例如：陳創價" autocomplete="off" value="${esc(staffQuery)}"></label><div id="staff-search-results" aria-live="polite"></div><small class="saved-note">查詢範圍：各地區已儲存的工作分工，以及會議紀錄中的紀錄人、司儀及領讀人員。</small></div></details><div class="footer">時間進度由 2026/10/13 出發式起算，依台灣時間顯示；日期經過不代表籌備事項已完成。</div>`}
function normalizeName(value){return String(value??'').normalize('NFKC').replace(/\s+/g,'').toLocaleLowerCase()}
function searchStaff(){const q=normalizeName(staffQuery),target=$('#staff-search-results');if(!target)return;if(!q){target.innerHTML='<p class="search-prompt muted">輸入姓名後，這裡會顯示查詢結果。</p>';return}const results=[];for(const s of SCHEDULE){const d=overviewCurrentData(data(s.name));for(const role of Object.keys(d.staff).filter(r=>!['notes','聚點禮物份數','校稿日期'].includes(r))){const value=d.staff[role];if(value&&normalizeName(value).includes(q))results.push({district:s.name,role,value,source:'工作分工',tab:'staff'})}for(const m of d.meetings){for(const [key,role] of [['recorder','會議紀錄人'],['host','會議司儀'],['reading','共讀／領讀及心得分享人員']]){const value=m[key];if(value&&normalizeName(value).includes(q))results.push({district:s.name,role,value,source:`第 ${m.round} 次運營會 · ${m.date}`,tab:'meeting'})}}}const regions=new Set(results.map(r=>r.district));target.innerHTML=results.length?`<p class="search-summary">找到 <b>${results.length}</b> 筆相關紀錄，涵蓋 <b>${regions.size}</b> 個地區</p><div class="staff-results">${results.map(r=>`<article class="staff-result"><div><span class="tag">${esc(r.district)}地區</span><h3>${esc(r.role)}</h3><p>${esc(r.value)}</p><small class="muted">來源：${esc(r.source)}</small></div><button class="btn" data-open="${esc(r.district)}" data-tab="${r.tab}">查看分工與紀錄 →</button></article>`).join('')}</div>`:'<div class="empty">找不到「'+esc(staffQuery.trim())+'」的相關紀錄。請確認姓名，或先到「工作分工」儲存今年的人員安排。</div>';bindOpens()}
function districtCard(s){const d=overviewCurrentData(data(s.name)),c=completion(d),[label,cls]=activityStatus(s),isPinned=pinned.includes(s.name);return `<article class="district-card ${isPinned?'pinned-card':''}"><div class="district-title"><h3>${s.name}地區</h3><div class="card-controls"><span class="tag ${cls}">${label}</span><button class="pin-button ${isPinned?'is-pinned':''}" data-pin="${s.name}" aria-label="${isPinned?'取消釘選':'釘選'}${s.name}地區" aria-pressed="${isPinned}"><span aria-hidden="true">${isPinned?'★':'☆'}</span> ${isPinned?'已釘選':'釘選'}</button></div></div><div class="dates"><div><small>正式總會</small><b>${dateLabel(s.date)}</b><p>${s.time} · 距活動 ${days(s.date)} 天</p></div><div><small>彩排</small><b>${dateLabel(s.rehearsal)}</b><p>${s.rehearsalTime} · ${s.venue}</p></div></div>${timeline(s)}<div class="card-bottom"><span>籌備 ${c.done}/${c.total} 項 · 紀錄 ${d.meetings.length} 份</span><button class="btn" data-open="${s.name}" data-tab="summary">進入工作區 →</button></div></article>`}
function cards(){const arr=SCHEDULE.filter(s=>s.name.includes(query)&& (filter==='all'||filter==='upcoming'&&Date.now()<timeMs(s.date,s.time)||filter==='rehearsed'&&Date.now()>=timeMs(s.rehearsal,s.rehearsalTime)&&Date.now()<timeMs(s.date,s.time)||filter==='ended'&&Date.now()>=timeMs(s.date,s.time)));const favorites=arr.filter(s=>pinned.includes(s.name)),others=arr.filter(s=>!pinned.includes(s.name));const searching=query.trim()!==''||filter!=='all';$('#result-count').textContent=arr.length+' 個地區';$('#cards').innerHTML=`<section aria-labelledby="pinned-title"><div class="pin-section-heading"><h3 id="pinned-title">我的釘選 <span class="muted">${favorites.length}</span></h3><small class="muted">個人釘選 · 僅保存在此瀏覽器</small></div><div class="district-grid" id="pinned-cards">${favorites.length?favorites.map(districtCard).join(''):`<div class="empty wide">${pinned.length?'沒有符合目前篩選的釘選地區。':'尚未釘選地區。展開下方「其他地區」，按卡片上的「釘選」，即可固定顯示。'}</div>`}</div></section><details class="other-districts" id="other-districts" ${otherDistrictsOpen||searching?'open':''}><summary><span>其他地區 <span class="other-count">${others.length}</span></span><span class="collapse-hint">展開／收合</span></summary><div class="district-grid" id="other-cards">${others.length?others.map(districtCard).join(''):'<div class="empty wide">沒有其他符合條件的地區。</div>'}</div></details>`;$('#other-districts').ontoggle=e=>{if(!searching)otherDistrictsOpen=e.target.open};document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const focusName=b.dataset.pin;togglePin(focusName);const moved=document.querySelector(`[data-pin="${focusName}"]`);if(moved&&(!moved.closest('details')||moved.closest('details').open))moved.focus();else $('#other-districts summary').focus()});bindOpens()}

function externalMeeting(d){const route=selectedFormRoute();const options=route?route.options.filter(v=>v.startsWith(selected+'地區')):[];const current=formGroupSelections[selected]||'';return `<section class="panel form-entry"><h2>總會紀錄表</h2><p class="muted">使用女子部原有的 Google 表單回報，填寫及照片上傳依原表單規則辦理。</p><div class="form-context"><div><small>目前地區</small><strong>${esc(selected)}地區</strong></div><div><small>對應支部</small><strong>${esc(route?.branch||'尚未確認對應支部')}</strong></div></div>${route?`<label class="field form-group-field"><span>請選擇這次回報的組別</span><select id="report-group"><option value="">請選擇組別…</option>${options.map(v=>`<option value="${esc(v)}" ${current===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`:'<p class="notice">目前表單尚無此地區的對應選項，開啟後請自行確認。</p>'}<div id="google-form-content">${formEntryContent(current)}</div></section>${d.meetings.length?`<details class="panel archived-meetings"><summary>先前儲存的網站會議紀錄（${d.meetings.length} 份）</summary><p class="saved-note">以下為舊版保存在此瀏覽器的紀錄，未提交到 Google 表單，可至「備份與匯出」下載保留。</p>${d.meetings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<article class="record"><h3>第 ${esc(m.round)} 次運營會 · ${esc(m.date)}</h3><small class="muted">紀錄人：${esc(m.recorder)}</small><p>${esc(m.decisions)}</p><details><summary>查看完整舊紀錄</summary>${[['紀錄人部別',m.department],['會議地點',m.location],['司儀',m.host],['共讀',m.reading],['區傳達',m.announcements],['上次決議',m.previous],...reports.map(r=>[r,m.reports?.[r]]),['待確認事項',m.pending],['下次開會',m.nextDate],['回傳狀態',m.returnStatus],['回傳日期',m.returnedAt],['附件連結',m.attachment]].map(([label,value])=>`<p><b>${esc(label)}</b><br>${esc(value||'未填寫')}</p>`).join('')}</details></article>`).join('')}</details>`:''}`}

function weeklyPlan(s,m,sandDate=weeklySandDate(s,m)){const old=m.weekly?.plan||[];return [...districtWeeklySessions(s).map(([date,n])=>{const saved=old.find(v=>v.date===date&&v.label.includes('運營日'))||{};return {label:`第${n}次運營日`+(date===sandDate?'（含沙推）':''),date,time:saved.time||'',venue:saved.venue||'',notes:saved.notes||''}}),{label:'彩排',date:s.rehearsal,time:s.rehearsalTime,venue:s.venue,notes:old.find(v=>v.label==='彩排')?.notes||''},{label:'地區總會',date:s.date,time:s.time,venue:'文化會堂',notes:old.find(v=>v.label==='地區總會')?.notes||''}]}
function weeklyMeeting(d){const s=SCHEDULE.find(v=>v.name===selected);const m=d.meetings.find(v=>v.id===editId)||{};const w=m.weekly||{};const sessions=districtWeeklySessions(s);const pending=sessions.findIndex(v=>v[0]>=today());const round=Math.min(sessions.length,Number(m.round)||(pending>=0?pending+1:sessions.length));const date=sessions[round-1][0];const plan=weeklyPlan(s,m);const sandDate=weeklySandDate(s,m);const targets=w.targets||Array.from({length:3},()=>Array(5).fill(''));const work=w.work||WEEKLY_WORK.map(([department,role,key,note])=>({department,role,person:d.staff[key]||'',notes:note}));const program=w.program||WEEKLY_PROGRAM.map(([role,key,note])=>({role,person:d.staff[role==='司儀'?'程序司儀':key]||'',notes:note}));return `<section class="panel weekly-meeting"><h2>${editId?'編輯':'新增'}四部運營協議紀錄</h2><p class="muted">依四部運營協議表整理：先確認日期與目標，再安排工作人員、程序擔當與討論事項。</p><p class="saved-note">${esc(selected)}地區運營紀錄 · 確認送出後自動產生 Word，並上傳本次運營資料夾。</p><p class="saved-note">填寫提醒：文字欄位若尚未確認，請填寫「待確認」；日期、時間及人數欄位請依實際確認結果填寫。</p><form id="meeting-form" data-weekly="true"><div class="form-grid weekly-basic"><label class="field"><span>運營場次 *</span><select name="round" id="weekly-round" required>${sessions.map(([day,n],i)=>`<option value="${i+1}" ${round===i+1?'selected':''}>${dateLabel(day)} 第${n}次運營</option>`).join('')}</select></label><label class="field"><span>開會日期 *</span><input aria-label="開會日期" name="date" type="date" value="${date}" readonly required></label>${field('開會時間','meetingTime',m.meetingTime||'','time')}${field('會議地點／方式','location',m.location||'')}${field('紀錄人','recorder',m.recorder||'','text',false,true)}<label class="field"><span>紀錄人部別</span><select name="department"><option value="">請選擇部別…</option>${['壯年部','婦人部','男子部','女子部','其他'].map(v=>`<option ${m.department===v?'selected':''}>${v}</option>`).join('')}</select></label>${field('導讀／領讀人員','reading',m.reading||'')}${field('出席人員','attendees',m.attendees||'')}</div><p id="weekly-session-note" class="saved-note"></p><p class="saved-note">確認送出後，自動產生 Word 並歸檔。其他幹部可從原有 Google 雲端資料夾取用。</p><details class="weekly-section" open><summary>相關運營日期、時間與地點</summary><p class="muted">本地區共有 ${sessions.length} 次週一運營，至 ${dateLabel(sessions[sessions.length-1][0])}；總會後不再列入。沙推請安排在彩排前的其中一次運營，不另增一場。</p><label class="field weekly-sand-field"><span>沙推安排（併入一次運營）</span><select name="sandDate" id="weekly-sand"><option value="">待確認，請選擇一次運營…</option>${sessions.filter(v=>v[0]<s.rehearsal).map(([date,n])=>`<option value="${date}" ${sandDate===date?'selected':''}>${dateLabel(date)} 第${n}次運營日</option>`).join('')}</select></label><p class="saved-note">地點若尚未確認，請填寫「待確認」。</p><div class="table-wrap"><table class="weekly-plan-table"><thead><tr><th>項目</th><th>日期／時間</th><th>地點</th></tr></thead><tbody>${plan.map((v,i)=>`<tr><th scope="row" data-plan-label="${i}">${esc(v.label)}</th><td>${weeklyInput(v.label+'日期','plan'+i+'-date',v.date,'date',true)}${weeklyInput(v.label+'時間','plan'+i+'-time',v.time,'time',i>=sessions.length)}</td><td>${weeklyInput(v.label+'地點','plan'+i+'-venue',v.venue,'text',i>=sessions.length)}</td></tr>`).join('')}</tbody></table></div></details><details class="weekly-section" open><summary>各部人數目標與祈念目標</summary><p class="muted">本表記錄本次協議的目標。新朋友、教宣對象依部別分別填寫，不會自動加進目標數，以免重複計算。沒有人數請填寫 0。</p><div class="table-wrap"><table><thead><tr><th>項目</th>${WEEKLY_GROUPS.map(v=>`<th>${v}</th>`).join('')}<th>合計</th></tr></thead><tbody>${WEEKLY_TARGET_ROWS.map((label,r)=>`<tr><th scope="row">${label}</th>${WEEKLY_GROUPS.map((g,c)=>`<td>${weeklyInput(g+' '+label,'target'+r+'-'+c,targets[r]?.[c]??'','number')}</td>`).join('')}<th data-weekly-total="${r}">尚未填寫</th></tr>`).join('')}</tbody></table></div><p class="weekly-prayer">共同祈念目標：晴爽、歡喜、無事故；全員出席、大勝利；異體同心、人才輩出。</p><div class="form-grid">${field('地區四部自訂祈念目標','districtGoal',w.districtGoal||'','textarea',true)}${field('個人挑戰目標與備註','personalGoal',w.personalGoal||'','textarea',true)}</div></details><details class="weekly-section"><summary>運營工作人員 <span class="muted">18 項分工</span></summary><p class="muted">人員會沿用已儲存的工作分工；這裡的修改只保留於本次會議紀錄，不會改動其他週次。</p><div class="table-wrap"><table class="weekly-assignments"><thead><tr><th>部別</th><th>工作組別</th><th>負責人</th><th>備註</th></tr></thead><tbody>${work.map((v,i)=>`<tr><th scope="row">${esc(v.department)}</th><td>${esc(v.role)}</td><td>${weeklyInput(v.department+v.role+'負責人','work'+i+'-person',v.person)}</td><td>${weeklyInput(v.department+v.role+'備註','work'+i+'-notes',v.notes)}</td></tr>`).join('')}</tbody></table></div></details><details class="weekly-section"><summary>程序擔當人員 <span class="muted">6 項程序</span></summary><p class="muted">依範本列出協議項目，年度程序與說明請依今年企劃確認。</p><div class="table-wrap"><table class="weekly-assignments"><thead><tr><th>程序</th><th>擔任者</th><th>備註</th></tr></thead><tbody>${program.map((v,i)=>`<tr><th scope="row">${esc(v.role)}</th><td>${weeklyInput(v.role+'擔任者','program'+i+'-person',v.person)}</td><td>${weeklyInput(v.role+'備註','program'+i+'-notes',v.notes)}</td></tr>`).join('')}</tbody></table></div></details><details class="weekly-section" open><summary>其他運營紀錄與後續追蹤</summary><div class="form-grid">${field('上次決議與待辦追蹤','previous',m.previous||'','textarea',true)}${field('本次討論內容與決議','decisions',m.decisions||'','textarea',true,true)}${field('待確認事項、負責人與預計確認時間','pending',m.pending||'','textarea',true)}${field('下次運營提報事項','nextAgenda',w.nextAgenda||'','textarea',true)}${field('下次開會日期','nextDate',m.nextDate||(sessions[round]?.[0]||''),'date')}</div><p class="saved-note">運營會後兩日內，請完成填寫並確認送出。</p></details><div class="form-footer"><span class="saved-note">確認送出後請等待成功訊息；上傳失敗會保留輸入供重試。</span><div class="actions">${editId?'<button class="btn" type="button" id="cancel-edit">取消編輯</button>':''}<button class="btn primary" type="submit">確認並送出運營紀錄</button></div></div></form></section>`}
function weeklyReadout(m){let items=[['會議地點／方式',m.location],['開會時間',m.meetingTime],['紀錄人部別',m.department],['導讀／領讀',m.reading],['出席人員',m.attendees],['上次決議',m.previous],['待確認事項',m.pending],['下次開會',m.nextDate],['附件連結',m.attachment]];const w=m.weekly;if(w){items.push(...w.plan.map(v=>[v.label,`${v.date||'日期未定'} ${v.time||''}／${v.venue||'地點未定'}${v.notes?'／'+v.notes:''}`]));w.targets.forEach((row,r)=>WEEKLY_GROUPS.forEach((g,c)=>items.push([g+' '+WEEKLY_TARGET_ROWS[r],row[c]])));items.push(['地區自訂祈念目標',w.districtGoal],['個人挑戰目標',w.personalGoal]);items.push(...w.work.map(v=>[v.department+' '+v.role,[v.person||'人選未定',v.notes].filter(Boolean).join('／')]),...w.program.map(v=>[v.role,[v.person||'人選未定',v.notes].filter(Boolean).join('／')]),['下次運營提報事項',w.nextAgenda])}return items.map(([label,value])=>`<p><b>${esc(label)}</b><br>${esc(value===''||value===undefined?'未填寫':value)}</p>`).join('')}
function weeklyRecordFromForm(form,id){const f=new FormData(form);const round=Number(f.get('round'));const s=SCHEDULE.find(v=>v.name===selected);const previous=data().meetings.find(m=>m.id===id)||{};const sandDate=String(f.get('sandDate')||'');const base=weeklyPlan(s,previous,sandDate);const read=n=>String(f.get(n)||'');const record={id:id||crypto.randomUUID(),kind:'weekly-v1',district:selected,round:read('round'),date:WEEKLY_SESSIONS[round-1][0],meetingTime:read('meetingTime'),location:read('location'),recorder:read('recorder').trim(),department:read('department'),reading:read('reading'),attendees:read('attendees'),previous:read('previous'),decisions:read('decisions').trim(),pending:read('pending'),nextDate:read('nextDate'),attachment:previous.attachment||'',reports:{},updatedAt:new Date().toISOString(),cloud:previous.cloud,weekly:{schemaVersion:2,sandDate,plan:base.map((v,i)=>({...v,time:i>=base.length-2?v.time:read('plan'+i+'-time'),venue:i>=base.length-2?v.venue:read('plan'+i+'-venue')})),targets:WEEKLY_TARGET_ROWS.map((_,r)=>WEEKLY_GROUPS.map((_,c)=>{const v=read('target'+r+'-'+c);return v===''?'':Number(v)})),districtGoal:read('districtGoal'),personalGoal:read('personalGoal'),work:WEEKLY_WORK.map(([department,role],i)=>({department,role,person:read('work'+i+'-person'),notes:read('work'+i+'-notes')})),program:WEEKLY_PROGRAM.map(([role],i)=>({role,person:read('program'+i+'-person'),notes:read('program'+i+'-notes')})),nextAgenda:read('nextAgenda')}};return record}
function validateWeeklyRecord(m){const w=m.weekly;const text=v=>typeof v==='string'&&v.length<=10000;if(!Number.isInteger(Number(m.round))||Number(m.round)<1||Number(m.round)>9||m.date!==WEEKLY_SESSIONS[Number(m.round)-1][0]||!w||typeof w!=='object')throw Error('運營週次或日期不符');if(!Array.isArray(w.plan)||w.plan.length<3||w.plan.length>12||w.plan.some(v=>!v||!['label','date','time','venue','notes'].every(k=>text(v[k]))))throw Error('運營日期規劃不符');if(w.schemaVersion===2){const district=SCHEDULE.find(v=>v.name===m.district);if(!district)throw Error('運營地區不符');const sessions=districtWeeklySessions(district);if(Number(m.round)>sessions.length||w.sandDate&&!sessions.some(v=>v[0]===w.sandDate&&v[0]<district.rehearsal))throw Error('運營場次或沙推日期不符');const expected=weeklyPlan(district,{},w.sandDate);if(w.plan.length!==expected.length||w.plan.some((v,i)=>v.date!==expected[i].date||v.label!==expected[i].label)||(w.plan.at(-1).venue!=='文化會堂')||w.plan.slice(-2).some((v,i)=>v.time!==expected.slice(-2)[i].time||v.venue!==expected.slice(-2)[i].venue))throw Error('運營日期或場地不符');}if(!Array.isArray(w.targets)||w.targets.length!==3||w.targets.some(row=>!Array.isArray(row)||row.length!==5||row.some(v=>v!==''&&(!Number.isInteger(v)||v<0||v>100000))))throw Error('各部目標格式不符');if(!Array.isArray(w.work)||w.work.length!==18||w.work.some(v=>!v||!['department','role','person','notes'].every(k=>text(v[k])))||!Array.isArray(w.program)||w.program.length!==6||w.program.some(v=>!v||!['role','person','notes'].every(k=>text(v[k]))))throw Error('運營人員或程序格式不符');if(!['districtGoal','personalGoal','nextAgenda'].every(k=>text(w[k])))throw Error('運營紀錄格式不符')}
function bindWeeklyMeeting(){const form=$('#meeting-form[data-weekly]');if(!form)return;form.querySelectorAll('input[name^="target"]').forEach(el=>{el.placeholder='沒有請填 0';});form.querySelectorAll('textarea,input[type="text"]').forEach(el=>{el.placeholder='若尚未確認，請填寫「待確認」。'});const schedule=SCHEDULE.find(v=>v.name===selected);const sessions=districtWeeklySessions(schedule);const update=()=>{const round=Number(form.elements.round.value);form.elements.date.value=sessions[round-1][0];$('#weekly-session-note').textContent='歸檔週次：'+dateLabel(sessions[round-1][0])+' 第'+sessions[round-1][1]+'次運營紀錄表。'};form.elements.round.oninput=e=>e.stopPropagation();form.elements.round.onchange=()=>{const existing=data().meetings.find(v=>v.kind==='weekly-v1'&&Number(v.round)===Number(form.elements.round.value));if(existing&&existing.id!==editId){if(dirty&&!discard())return;editId=existing.id;render();return}update();form.elements.nextDate.value=sessions[Number(form.elements.round.value)]?.[0]||'';dirty=true};$('#weekly-sand').onchange=()=>{const plan=weeklyPlan(schedule,{},form.elements.sandDate.value);plan.forEach((v,i)=>{form.querySelector(`[data-plan-label="${i}"]`).textContent=v.label});dirty=true};update();const total=()=>WEEKLY_TARGET_ROWS.forEach((_,r)=>{const vals=WEEKLY_GROUPS.map((_,c)=>form.elements['target'+r+'-'+c].value);form.querySelector(`[data-weekly-total="${r}"]`).textContent=vals.every(v=>v==='')?'尚未填寫':vals.reduce((a,v)=>a+Number(v||0),0)+(vals.some(v=>v==='')?'（部分未填）':'')});form.addEventListener('input',total);total();form.onsubmit=e=>{e.preventDefault();const m=weeklyRecordFromForm(form,editId);validateWeeklyRecord(m);if(!m.recorder||!m.decisions){toast('請填寫紀錄人及本次討論內容與決議。');return}const list=data().meetings.slice();const i=list.findIndex(v=>v.id===m.id);if(i>=0)list[i]=m;else list.push(m);if(saveDistrict({meetings:list})){editId=null;render()}}}
function datePlus(date,n){const d=new Date(date+'T12:00:00+08:00');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

const summaryEditorOpen={staff:false,counts:false,tasks:false};
function latestWeeklyMeeting(d){return d.meetings.filter(m=>m.kind==='weekly-v1'&&m.weekly).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''))[0]}
function overviewCurrentData(d){const current={...d,staff:{...d.staff},counts:structuredClone(d.counts)};const latest=latestWeeklyMeeting(d);if(!latest)return current;if((latest.updatedAt||'')>(d.staffUpdatedAt||'')){latest.weekly.work.forEach((row,i)=>{const key=WEEKLY_WORK[i]?.[2];if(key)current.staff[key]=row.person});latest.weekly.program.forEach((row,i)=>{const key=i===0?'程序司儀':WEEKLY_PROGRAM[i]?.[1];if(key)current.staff[key]=row.person})}if((latest.updatedAt||'')>(d.countsUpdatedAt||'')){latest.weekly.targets[0].forEach((value,i)=>{const key=groups[i];if(value!=='')current.counts[key]={...current.counts[key],target:value}})}return current}
function summaryStaffFields(d){const fields=new Map();WEEKLY_WORK.forEach(([department,label,key])=>fields.set(key,{key,label:department+' · '+label}));WEEKLY_PROGRAM.forEach(([label,key],i)=>{key=i===0?'程序司儀':key;if(!fields.has(key))fields.set(key,{key,label:'程序 · '+label})});Object.entries(d.staff).forEach(([key,value])=>{if(key!=='notes'&&value&&!fields.has(key))fields.set(key,{key,label:key})});return [...fields.values()]}
function withoutPanel(html){return html.replace(/^<section class="panel">/,'').replace(/<\/section>$/,'')}
function summaryEditor(key,label,html){return `<details class="summary-editor" id="summary-editor-${key}" ${summaryEditorOpen[key]?'open':''}><summary>${label}</summary><div class="summary-editor-body">${html}</div></details>`}
function summaryStaffEditor(d){return `<form id="staff-form" data-summary="true"><div class="form-grid">${summaryStaffFields(d).map(({key,label},i)=>field(label,'current-role'+i,d.staff[key]||'',key==='校稿日期'?'date':key==='聚點禮物份數'?'number':'text')).join('')}${field('分工備註與待確認事項','notes',d.staff.notes||'','textarea',true)}</div><div class="form-footer"><span class="saved-note">尚未確認的人員請填「待確認」。</span><button class="btn primary" type="submit">儲存工作分工</button></div></form>`}
function consolidatedSummary(s,raw){const d=overviewCurrentData(raw),c=completion(d),latest=latestWeeklyMeeting(raw);const staffFields=summaryStaffFields(d);const appointed=staffFields.filter(({key})=>d.staff[key]);const total=k=>groups.reduce((sum,g)=>sum+Number(d.counts[g]?.[k]||0),0);const shown=v=>v===''||v===undefined?'未填寫':esc(v);return `<section class="panel"><h2>總會與彩排</h2>${timeline(s)}<div class="dates"><div><small>彩排</small><b>${dateLabel(s.rehearsal)} ${s.rehearsalTime}</b><p>${s.venue} · 支援地區：${s.support}</p></div><div><small>正式總會</small><b>${dateLabel(s.date)} ${s.time}</b><p>文化會堂 · 工作人員 ${String(Number(s.time.slice(0,2))-1).padStart(2,'0')+s.time.slice(2)} 集合</p></div></div></section><section class="panel overview-block" aria-labelledby="summary-staff-heading"><div class="overview-block-heading"><h2 id="summary-staff-heading">工作分工</h2><span class="muted">已填寫 ${appointed.length} 項</span></div><p class="muted">${latest?'顯示已確認的工作安排；最近運營紀錄：'+esc(latest.date)+'。':'確認後的人員安排會集中顯示在這裡。'}</p>${appointed.length?`<div class="table-wrap"><table class="overview-staff-table"><thead><tr><th>工作項目</th><th>負責人／擔任者</th></tr></thead><tbody>${appointed.map(({key,label})=>`<tr><th scope="row">${esc(label)}</th><td>${esc(d.staff[key])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="overview-empty">尚未填寫工作分工。可從下方修改，或在運營紀錄中協議人員安排。</p>'}${summaryEditor('staff','修改工作分工',summaryStaffEditor(d))}</section><section class="panel overview-block" aria-labelledby="summary-counts-heading"><div class="overview-block-heading"><h2 id="summary-counts-heading">人數統計</h2><span class="muted">${d.countDate?'統計日期：'+esc(d.countDate):'尚未登錄統計日期'}</span></div><p class="muted">各部目標可沿用最近一次運營協議；已邀約與實際出席可在這裡更新。</p><div class="overview-count-totals"><div><span>已邀約</span><strong>${total('invited')}<small> 人</small></strong></div><div><span>實際出席</span><strong>${total('actual')}<small> 人</small></strong></div></div><div class="table-wrap"><table><thead><tr><th>分類</th><th>人數目標</th><th>已邀約</th><th>實際出席</th></tr></thead><tbody>${groups.map(g=>`<tr><th scope="row">${g}</th>${['target','invited','actual'].map(k=>`<td>${shown(d.counts[g]?.[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${summaryEditor('counts','修改人數統計',withoutPanel(counts(d)))}</section><section class="panel overview-block" aria-labelledby="summary-tasks-heading"><div class="overview-block-heading"><h2 id="summary-tasks-heading">籌備進度</h2><span>${c.done} / ${c.total} 項完成</span></div><div class="progress"><div style="width:${c.pct}%"></div></div><ul class="overview-task-list">${tasks.map(([name],i)=>`<li><span>${name}</span><span class="task-state ${d.tasks[i]==='已完成'?'completed':''}">${esc(d.tasks[i]||'尚未開始')}</span></li>`).join('')}</ul>${summaryEditor('tasks','更新籌備進度',withoutPanel(taskForm(d)))}</section><p class="saved-note">這裡顯示目前狀況；每次運營紀錄仍保留當時的人員與目標，不會因總覽更新而改動。</p>`}
function bindSummaryForms(){if(page!=='district'||tab!=='summary')return;for(const key of ['staff','counts','tasks']){const panel=$('#summary-editor-'+key);if(panel)panel.ontoggle=()=>summaryEditorOpen[key]=panel.open}const staffForm=$('#staff-form[data-summary]');if(staffForm){const fields=summaryStaffFields(overviewCurrentData(data()));staffForm.querySelectorAll('input[type="text"],textarea').forEach(el=>el.placeholder='若尚未確認，請填寫「待確認」。');staffForm.onsubmit=e=>{e.preventDefault();const f=new FormData(staffForm),staff={...overviewCurrentData(data()).staff};fields.forEach(({key},i)=>staff[key]=String(f.get('current-role'+i)||''));staff.notes=String(f.get('notes')||'');if(saveDistrict({staff,staffUpdatedAt:new Date().toISOString()}))render()}}const countsForm=$('#counts-form');if(countsForm)countsForm.onsubmit=e=>{e.preventDefault();const f=new FormData(countsForm),counts=Object.fromEntries(groups.map((g,i)=>[g,Object.fromEntries(['target','invited','actual'].map(k=>[k,Number(f.get('count'+i+'-'+k))]))]));if(saveDistrict({counts,countDate:f.get('countDate'),counter:f.get('counter'),countNotes:f.get('countNotes'),countsUpdatedAt:new Date().toISOString()}))render()}}
function staff(d){return `<section class="panel"><h2>工作人員與程序分工</h2><p class="muted">填寫今年確認的人員；可同時記錄多位姓名及彩排／正式場次備註。</p><form id="staff-form"><div class="form-grid">${roles.map((r,i)=>field(r,'role'+i,d.staff[r]||'',r==='校稿日期'?'date':r==='聚點禮物份數'?'number':'text')).join('')}${field('分工備註與待確認事項','notes',d.staff.notes||'','textarea',true)}</div><div class="form-footer"><span class="saved-note">欄位空白表示尚未填寫。</span><button class="btn primary" type="submit">儲存工作分工</button></div></form></section>`}
function counts(d){return `<section class="panel"><h2>邀約與出席人數</h2><p class="muted">各分類請填不重複的人數。新朋友及教宣對象不要重複列入部別；表格內 21 個人數欄位皆為必填；確認無人請填 0，不能留白。統計日期與統計人也必須填寫，備註選填。</p><form id="counts-form"><div class="table-wrap"><table><thead><tr><th>分類</th><th>人數目標</th><th>已邀約</th><th>實際出席</th></tr></thead><tbody>${groups.map((g,i)=>`<tr><td>${g}</td>${['target','invited','actual'].map(k=>`<td><input aria-label="${g}${{target:'人數目標',invited:'已邀約',actual:'實際出席'}[k]}" type="number" name="count${i}-${k}" min="0" max="100000" step="1" required value="${esc(d.counts[g]?.[k]??'')}"></td>`).join('')}</tr>`).join('')}<tr><th>四部合計</th>${['target','invited','actual'].map(k=>`<th data-total="four-${k}">—</th>`).join('')}</tr><tr><th>全部分類合計</th>${['target','invited','actual'].map(k=>`<th data-total="all-${k}">—</th>`).join('')}</tr></tbody></table></div><div class="form-grid" style="margin-top:20px">${field('人數統計日期','countDate',d.countDate||today(),'date',false,true)}${field('統計人','counter',d.counter||'','text',false,true)}${field('人數備註（選填）','countNotes',d.countNotes||'','textarea',true)}</div><div class="form-footer"><span class="saved-note">全部必填欄位完成後才能送出；合計會自動計算。</span><button class="btn primary" type="submit">儲存人數統計</button></div></form></section>`}
function taskForm(d){const s=SCHEDULE.find(x=>x.name===selected);return `<section class="panel"><h2>籌備事項與回報進度</h2><p class="muted">依實際狀況更新。設為「不適用」的事項不列入完成度。</p><form id="tasks-form">${tasks.map(([name,note],i)=>`<label class="task"><span><b>${name}</b><small>${i===6?dateLabel(s.rehearsal)+' '+s.rehearsalTime:i===7||i===8?dateLabel(s.date):i===9?datePlus(s.date,3)+' 前回傳':note}</small></span><select name="task${i}" aria-label="${name}">${['尚未開始','進行中','已完成','不適用'].map(v=>`<option ${d.tasks[i]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<div style="margin-top:20px">${field('進度備註','taskNotes',d.taskNotes||'','textarea')}</div><div class="form-footer"><span class="saved-note">此處用於紀錄狀態，尚未自動傳送資料至區。</span><button class="btn primary" type="submit">儲存籌備進度</button></div></form></section>`}
function resources(){return `<div class="head"><div><div class="eyebrow">共同參考資料</div><h1>企劃與開會資料</h1><p class="muted">先閱讀參考文件，再從各地區工作區輸入今年的紀錄。</p></div></div><div class="resources">${[['今年總會企劃案','2026 年籌備事項、活動安排與注意事項。','https://docs.google.com/document/d/1nMdcnDTTZC_Fw_W8QUbZD8XB-V-J7t9Y/edit'],['今年總會與彩排時程','2027 新年度總會時程，實際活動日期為 2026 年 12 月。','schedule-current.html'],['去年總會回報表','參考欄位與分工方式；去年的日期、人名、繳交狀態不套用於今年。','https://docs.google.com/spreadsheets/d/1cOhe_Cdrr983OaDjod-_gTE2ainmuLIk89Uqh9rQisU/edit'],['今年四部運營協議表 Word 範本','今年新表格的光興版面範例；各地區日期以網站為準。','templates/assembly-2027-guangxing.docx']].map(([t,d,u],i)=>`<article class="panel resource"><div><h2>${t}</h2><p>${d}</p></div><a class="btn" href="${u}" target="_blank" rel="noopener noreferrer">${['開啟企劃案','查看總會時程','開啟去年回報表','開啟紀錄表範本'][i]} ↗</a></article>`).join('')}</div><section class="panel"><h2>使用流程</h2><p>選擇地區 → 填寫運營紀錄 → 在總覽確認人員與目標 → 在運營回報查看缺漏 → 匯出備份。</p><p class="muted">網站資料目前保存在個人瀏覽器。每週雲端資料夾已提供入口，回傳請自行完成；多人同步與自動上傳尚未啟用。</p></section>`}
function backup(){if(cloudEnabled())return cloudBackup();return `<div class="head"><div><div class="eyebrow">資料管理</div><h1>備份與匯出</h1><p class="muted">讓目前瀏覽器的紀錄可以保留、轉移及查閱。</p></div></div><div class="notice">本版本尚未連接多人共用儲存。不同瀏覽器、不同裝置的資料不會自動同步；清除瀏覽器資料會移除本地紀錄。</div><section class="panel"><h2>完整資料備份</h2><p class="muted">下載所有地區的 JSON 備份，包含會議、人員、人數、籌備狀態及雲端位置設定；可用於重新匯入。上傳區的檔案本體請個別下載備份，不包含在 JSON 中。</p><div class="actions" style="margin-top:20px"><button class="btn primary" id="export-json">匯出完整備份</button><button class="btn" id="import-json">匯入備份</button><input type="file" accept=".json,application/json" id="import-file" hidden></div><p class="saved-note">匯入將取代此瀏覽器的全部網站紀錄，執行前請先匯出目前備份。</p></section><section class="panel"><h2>人數統計匯出</h2><p class="muted">匯出各地區人數、活動時間及籌備完成度，方便在試算表中彙整。</p><button class="btn" id="export-csv">匯出統計 CSV</button></section><section class="panel"><h2>這個版本的儲存方式</h2><p>每次按「儲存」後，資料會保留在目前的瀏覽器。網站重新整理仍可讀取；請留意隱私模式可能無法持久保存。</p><p>下一階段接上共用儲存後，才能讓各地區人員共同查看、輸入及同步紀錄。</p></section>`}
function submissionRows(form){return Array.from(form.elements).filter(el=>el.name&&!el.disabled&&!['submit','button','reset'].includes(el.type)).map(el=>{const label=el.getAttribute('aria-label')||el.closest('.field')?.querySelector('span')?.textContent||el.closest('.task')?.querySelector('b')?.textContent||el.name;const value=el.type==='file'?Array.from(el.files).map(f=>`${f.name}（${(f.size/1024/1024).toFixed(2)} MB）`).join('、'):el.value;return {label:label.replace(/\s*\*\s*$/,''),value:String(value||'').trim()||'未填寫'}})}
function reviewSubmission(form){return new Promise(resolve=>{const title=form.dataset.reviewTitle|| (form.dataset.weekly?'四部運營協議紀錄':form.dataset.upload?(form.dataset.upload==='ppt'?'幸福1+1 PPT':'幸福1+1稿件'):{'meeting-form':'會議紀錄','staff-form':'工作分工','counts-form':'人數統計','tasks-form':'籌備進度','upload-settings-form':'Google 雲端位置'}[form.id]||'填寫內容');const dialog=document.createElement('dialog');dialog.className='submission-review';dialog.setAttribute('aria-labelledby','submission-review-title');dialog.innerHTML=`<div class="review-heading"><h2 id="submission-review-title">確定輸入內容正確嗎？</h2><p>${esc(selected)}地區 · ${esc(title)}</p></div><div class="review-content"><dl>${submissionRows(form).map(({label,value})=>`<div class="review-row"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl></div><div class="review-footer"><p class="saved-note">確認送出後儲存在此瀏覽器，尚未與其他人共用。</p><div class="actions"><button type="button" class="btn" data-review="cancel" autofocus>返回修改</button><button type="button" class="btn primary" data-review="confirm">確認送出</button></div></div>`;if(cloudConnected)dialog.innerHTML=cloudCopy(dialog.innerHTML);document.body.append(dialog);const finish=confirmed=>{dialog.close();dialog.remove();resolve(confirmed)};dialog.querySelector('[data-review="cancel"]').onclick=()=>finish(false);dialog.querySelector('[data-review="confirm"]').onclick=()=>finish(true);dialog.oncancel=e=>{e.preventDefault();finish(false)};dialog.showModal()})}
function bindSubmissionReview(){document.querySelectorAll('#content form').forEach(form=>{if(form.id==='cloud-connect-form')return;const submit=form.onsubmit;if(!submit)return;let reviewing=false;form.onsubmit=async e=>{e.preventDefault();if(reviewing)return;if(!form.reportValidity())return;if(form.classList.contains('report-confirm-form')&&!form.elements.confirmedBy.value.trim()){form.elements.confirmedBy.focus();toast('請填寫確認人姓名。');return}if(form.id==='counts-form'&&!form.elements.counter.value.trim()){form.elements.counter.focus();toast('請填寫統計人姓名。');return}if(form.id==='meeting-form'&&(!form.elements.recorder.value.trim()||!form.elements.decisions.value.trim()||Number(form.elements.round.value)<1)){toast('請填寫紀錄人、決議，運營次數需至少為 1。');return}reviewing=true;try{if(await reviewSubmission(form))await submit.call(form,e)}finally{reviewing=false}}})}
function bindOpens(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('district',b.dataset.open,b.dataset.tab))}
function bind(){bindOpens();bindGoogleForm();bindDistrictNavigation();document.querySelectorAll('[data-tab]:not([data-open])').forEach(b=>b.onclick=()=>go('district',selected,b.dataset.tab));document.querySelectorAll('form').forEach(f=>f.oninput=()=>dirty=true);bindUploads();if($('#staff-search')){$('#staff-search').oninput=e=>{staffQuery=e.target.value;searchStaff()};searchStaff()}if($('#search')){$('#search').oninput=e=>{query=e.target.value;cards()};$('#filter').value=filter;$('#filter').onchange=e=>{filter=e.target.value;cards()};cards()}if($('#back'))$('#back').onclick=()=>go('overview');if($('#district-select'))$('#district-select').onchange=e=>{if(discard()){selected=e.target.value;editId=null;render()}else e.target.value=selected};if($('#meeting-form'))$('#meeting-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.recorder.trim()||!f.decisions.trim()||+f.round<1){toast('請填寫紀錄人、決議，運營次數需至少為 1。');return}const m={...f,id:editId||crypto.randomUUID(),reports:Object.fromEntries(reports.map((r,i)=>[r,f['report'+i]])),updatedAt:new Date().toISOString()};reports.forEach((_,i)=>delete m['report'+i]);const list=data().meetings.slice();const index=list.findIndex(x=>x.id===m.id);if(index>=0)list[index]=m;else list.push(m);if(saveDistrict({meetings:list})){editId=null;render()}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{if(!discard())return;editId=b.dataset.edit;render();window.scrollTo({top:0})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!discard())return;if(confirm('確定刪除此份會議紀錄？可先匯出備份。')){if(saveDistrict({meetings:data().meetings.filter(x=>x.id!==b.dataset.delete)}))render()}});if($('#cancel-edit'))$('#cancel-edit').onclick=()=>{if(discard()){editId=null;render()}};if($('#print'))$('#print').onclick=()=>window.print();if($('#staff-form'))$('#staff-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const staff=Object.fromEntries(roles.map((r,i)=>[r,f.get('role'+i)]));staff.notes=f.get('notes');if(saveDistrict({staff}))render()};if($('#counts-form')){const form=$('#counts-form');const sum=()=>{for(const k of ['target','invited','actual'])for(const [type,n] of [['four',4],['all',7]]){const values=groups.slice(0,n).map((_,i)=>form.elements['count'+i+'-'+k].value);$(`[data-total="${type}-${k}"]`).textContent=values.every(v=>v==='')?'尚未填寫':values.reduce((a,v)=>a+Number(v||0),0)+(values.some(v=>v==='')?'（部分未填）':'')}};form.addEventListener('input',sum);sum();form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),counts=Object.fromEntries(groups.map((g,i)=>[g,Object.fromEntries(['target','invited','actual'].map(k=>[k,f.get('count'+i+'-'+k)===''?'':Number(f.get('count'+i+'-'+k))]))]));if(saveDistrict({counts,countDate:f.get('countDate'),counter:f.get('counter'),countNotes:f.get('countNotes')}))render()}}if($('#tasks-form'))$('#tasks-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(saveDistrict({tasks:Object.fromEntries(tasks.map((_,i)=>[i,f.get('task'+i)])),taskNotes:f.get('taskNotes')}))render()};if($('#export-json'))$('#export-json').onclick=()=>{if(loadError){download(localStorage.getItem(KEY)||'','district-assembly-original.json','application/json');return}download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'地區總會備份-'+today()+'.json','application/json')};if($('#export-csv'))$('#export-csv').onclick=exportCsv;if($('#import-json'))$('#import-json').onclick=()=>$('#import-file').click();if($('#import-file'))$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('備份超過 10 MB');const imported=JSON.parse(await file.text());validate(imported);if(!confirm('匯入會取代此瀏覽器全部網站紀錄。已備份目前資料並確定要繼續？'))return;const previousError=loadError;loadError='';if(persist(imported)){render();toast('備份已匯入')}else loadError=previousError}catch(err){toast('無法匯入：'+err.message)}finally{e.target.value=''}}}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已產生下載檔案')}
function exportCsv(){const rows=[['地區','正式日期','正式時間','彩排日期','彩排時間','彩排場地','支援地區','會議紀錄份數','籌備完成度','分類','人數目標','已邀約','實際出席']];SCHEDULE.forEach(s=>{const d=overviewCurrentData(data(s.name));groups.forEach(g=>rows.push([s.name,s.date,s.time,s.rehearsal,s.rehearsalTime,s.venue,s.support,d.meetings.length,completion(d).pct+'%',g,d.counts[g]?.target??'',d.counts[g]?.invited??'',d.counts[g]?.actual??'']))});download('\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'地區總會統計-'+today()+'.csv','text/csv')}
function uploadArea(d){return `<section class="panel"><h2>幸福1+1稿件與PPT</h2><p class="muted">${esc(selected)}地區的發表稿與簡報，分開整理、保存。</p><div class="notice">選擇檔案並確認送出，由系統自動上傳至指定位置。使用者不需要進入雲端資料夾。</div><div class="upload-grid">${[['manuscript','幸福1+1稿件','Word、PDF 或文字檔','.doc,.docx,.pdf,.txt,.odt'],['ppt','幸福1+1 PPT','PowerPoint 或 PDF','.ppt,.pptx,.pdf']].map(([key,title,hint,accept])=>`<section class="upload-box"><h3>${title}</h3><p class="muted">${hint} · 每個檔案上限25 MB</p><form data-upload="${key}"><label class="field"><span>選擇${key==='ppt'?'簡報':'稿件'}檔案</span><input name="file" type="file" accept="${accept}" required aria-label="選擇${title}檔案"></label><div style="margin-top:14px">${field('發表人／檔案說明（選填）','description')}</div><button class="btn primary" type="submit" style="margin-top:18px">上傳${key==='ppt'?'PPT':'稿件'}</button></form><div class="file-list" id="files-${key}" aria-live="polite">正在讀取檔案…</div></section>`).join('')}</div></section>`}

function driveFolder(value){if(!value)return '';try{const u=new URL(value);if(u.protocol!=='https:'||u.hostname!=='drive.google.com'||!/^\/drive\/(?:u\/\d+\/)?folders\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)||u.username||u.password)return '';return u.href}catch{return ''}}
let fileDBPromise;
function fileDB(){if(!fileDBPromise)fileDBPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('district-assembly-files-2027',1);request.onupgradeneeded=()=>{const store=request.result.createObjectStore('files',{keyPath:'id'});store.createIndex('district','district')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('請關閉其他網站分頁後再試'))});return fileDBPromise}
async function fileOperation(mode,action){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files',mode);const req=action(tx.objectStore('files'));let value;req.onsuccess=()=>value=req.result;tx.oncomplete=()=>resolve(value);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('保存已中止'))})}
function bytesLabel(size){return size<1048576?Math.max(1,Math.round(size/1024))+' KB':(size/1048576).toFixed(1)+' MB'}
async function showFiles(districtName){try{const records=await fileOperation('readonly',store=>store.index('district').getAll(districtName));if(page!=='district'||tab!=='uploads'||selected!==districtName||cloudConnected)return;for(const type of ['manuscript','ppt']){const list=$('#files-'+type);if(!list)continue;const files=records.filter(f=>f.type===type).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));list.innerHTML=files.length?files.map(f=>`<article class="uploaded-file"><strong>${esc(f.name)}</strong><small>${bytesLabel(f.size)} · ${new Date(f.createdAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}</small>${f.description?`<p>${esc(f.description)}</p>`:''}<span class="tag">已存於此瀏覽器 · 尚未上傳雲端</span><div class="actions"><button class="btn" data-file-download="${esc(f.id)}" aria-label="下載${esc(f.name)}">下載</button><button class="btn danger" data-file-delete="${esc(f.id)}" aria-label="刪除${esc(f.name)}">刪除</button></div></article>`).join(''):'<div class="empty">尚未保存檔案。</div>'}document.querySelectorAll('[data-file-download]').forEach(b=>b.onclick=async()=>{try{const f=await fileOperation('readonly',store=>store.get(b.dataset.fileDownload));if(!f)throw Error('檔案不存在');const url=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){toast('無法下載檔案：'+e.message)}});document.querySelectorAll('[data-file-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('確定刪除此瀏覽器保存的檔案？請先下載備份；Google 雲端檔案不受影響。'))return;try{await fileOperation('readwrite',store=>store.delete(b.dataset.fileDelete));await showFiles(districtName);toast('已刪除此瀏覽器的檔案')}catch(e){toast('刪除失敗：'+e.message)}})}catch(e){if(page==='district'&&tab==='uploads'&&selected===districtName)for(const type of ['manuscript','ppt']){const el=$('#files-'+type);if(el)el.textContent='無法讀取本機檔案儲存，請檢查瀏覽器設定。'}}}
function bindUploads(){if(!document.querySelector('[data-upload]'))return;const districtName=selected;showFiles(districtName);document.querySelectorAll('[data-upload]').forEach(form=>{form.oninput=null;form.onsubmit=async e=>{e.preventDefault();const file=form.elements.file.files[0];if(!file)return;const allowed=form.dataset.upload==='ppt'?['ppt','pptx','pdf']:['doc','docx','pdf','txt','odt'];const ext=file.name.split('.').pop().toLowerCase();if(!allowed.includes(ext)){toast('檔案格式不符，請依上方列出的格式選擇。');return}if(file.size>25*1024*1024){toast('檔案超過 25 MB，請縮小檔案後再保存。');return}if(!file.size){toast('無法保存空白檔案。');return}const button=form.querySelector('[type=submit]');button.disabled=true;const label=button.textContent;button.textContent='正在保存…';try{await fileOperation('readwrite',store=>store.put({id:crypto.randomUUID(),district:districtName,type:form.dataset.upload,name:file.name,size:file.size,description:form.elements.description.value,blob:file,createdAt:new Date().toISOString()}));form.reset();await showFiles(districtName);toast('檔案已保存於此瀏覽器，尚未上傳 Google 雲端。')}catch(e){toast('保存檔案失敗，請確認瀏覽器可用空間。')}finally{button.disabled=false;button.textContent=label}}})}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page,selected,page==='overview'?'summary':tab));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();

window.addEventListener("storage",e=>{if(e.key===PIN_KEY){try{const v=JSON.parse(e.newValue||"[]");if(Array.isArray(v)){pinned=[...new Set(v.filter(n=>SCHEDULE.some(s=>s.name===n)))];if(page==="overview")cards();}}catch{}}});
